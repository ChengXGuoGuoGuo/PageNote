<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PageNote 演示页面</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#17211f;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}.top{background:#17211f;padding:18px 8%;color:#fff}.top strong{font-size:20px}main{width:min(920px,84%);margin:48px auto}.intro{margin-bottom:36px}h1{font-size:40px;line-height:1.2}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{border:1px solid #d9ddd7;border-radius:8px;background:#fff;padding:20px}.item span{color:#f0643b;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:30px}}
  </style>
</head>
<body>
  <header class="top"><strong>示例产品页</strong></header>
  <main>
    <section class="intro"><h1>用于测试网页批注的简单页面</h1><p>将这个文件上传到 PageNote，然后在标题、说明或下面任意模块上添加批注。</p></section>
    <section class="grid">
      <article class="item"><span>01</span><h2>需求确认</h2><p>对页面内容和交互要求进行集中评审。</p></article>
      <article class="item"><span>02</span><h2>问题跟踪</h2><p>记录作者、时间、回复与处理状态。</p></article>
      <article class="item"><span>03</span><h2>分享协作</h2><p>通过同一个链接查看页面和全部批注。</p></article>
    </section>
  </main>
</body>
</html>
