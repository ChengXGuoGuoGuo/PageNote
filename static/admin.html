<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>PageNote 管理台</title>
  <style>
    :root{--ink:#17211f;--muted:#68726f;--paper:#f4f4ef;--panel:#fff;--line:#d9ddd7;--accent:#f0643b;--accent-dark:#d94d27;--danger:#bd3d24;--success:#2c765a;--shadow:0 16px 45px rgba(23,33,31,.12)}
    *{box-sizing:border-box}html{min-width:320px;background:var(--paper)}body{margin:0;color:var(--ink);background:var(--paper);font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}button,input{font:inherit}
    .skip{position:fixed;top:-50px;left:12px;z-index:20;background:#fff;padding:10px 14px}.skip:focus{top:12px}.topbar{position:sticky;top:0;z-index:10;display:flex;min-height:64px;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:rgba(244,244,239,.96);padding:10px 22px;backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:850}.mark{display:grid;width:38px;height:38px;place-items:center;border-radius:8px;background:var(--ink);color:#fff;font:800 14px/1 ui-monospace,monospace;transform:rotate(-3deg)}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600}.top-actions{display:flex;margin-left:auto;align-items:center;gap:7px}
    .btn{display:inline-flex;height:38px;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;color:var(--ink);cursor:pointer;font-weight:750;text-decoration:none;white-space:nowrap}.btn:hover{border-color:#aeb7b3;background:#fbfbf8}.btn:focus-visible,input:focus-visible{outline:3px solid rgba(240,100,59,.22);outline-offset:1px}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.danger{border-color:#e7b4a8;color:var(--danger)}.logout{margin:0}
    .page{width:min(1240px,100%);margin:0 auto;padding:26px 24px 50px}.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;padding-bottom:22px;border-bottom:1px solid var(--line)}.eyebrow{margin-bottom:7px;color:var(--accent-dark);font:800 11px/1 ui-monospace,monospace;letter-spacing:.12em}.intro h1{margin:0 0 6px;font-size:28px;line-height:1.2;letter-spacing:0}.intro p{margin:0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(94px,1fr));gap:8px}.stat{min-width:100px;border-left:3px solid var(--ink);background:#fff;padding:10px 12px}.stat strong{display:block;font:800 21px/1.1 ui-monospace,monospace}.stat span{color:var(--muted);font-size:10px}
    .filters{display:flex;align-items:center;gap:8px;padding:18px 0}.search{min-width:200px;flex:1;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;color:var(--ink);outline:none}.search:focus{border-color:#8e9b97}.result{color:var(--muted);font-size:12px}
    .project-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.project{display:flex;min-width:0;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px;box-shadow:0 5px 18px rgba(23,33,31,.04)}.project:hover{border-color:#b7bfbc}.project-head{display:flex;align-items:flex-start;gap:12px}.project-index{display:grid;width:34px;height:34px;flex:0 0 auto;place-items:center;border-radius:7px;background:var(--ink);color:#fff;font:800 11px/1 ui-monospace,monospace}.project-name{min-width:0;flex:1}.project h2{margin:0 0 3px;overflow:hidden;font-size:17px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.project-id{overflow:hidden;color:var(--muted);font:10px/1.4 ui-monospace,monospace;text-overflow:ellipsis;white-space:nowrap}.project-metrics{display:grid;grid-template-columns:repeat(3,1fr);margin:15px 0;border-block:1px solid #edf0ed}.metric{padding:10px 4px;text-align:center}.metric+.metric{border-left:1px solid #edf0ed}.metric strong{display:block;font:800 17px/1.1 ui-monospace,monospace}.metric span{color:var(--muted);font-size:9px}.meta{display:grid;gap:5px;color:var(--muted);font-size:11px}.meta-row{display:flex;justify-content:space-between;gap:12px}.meta-row span:last-child{min-width:0;overflow:hidden;color:#3b4642;text-align:right;text-overflow:ellipsis;white-space:nowrap}.project-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}.project-actions .danger{margin-left:auto}
    .empty{grid-column:1/-1;border:1px dashed #aeb7b3;border-radius:8px;padding:54px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:6px;color:var(--ink);font-size:17px}.loading{grid-column:1/-1;padding:50px;text-align:center;color:var(--muted)}
    dialog{width:min(480px,calc(100% - 28px));border:1px solid var(--line);border-radius:8px;background:#fff;padding:0;color:var(--ink);box-shadow:0 24px 80px rgba(23,33,31,.3)}dialog::backdrop{background:rgba(23,33,31,.42)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:18px}.close{display:grid;width:34px;height:34px;place-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:19px}.form{display:grid;gap:14px;padding:20px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:750}.field input{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 11px;outline:none}.field input:focus{border-color:var(--accent)}.help{margin:0;color:var(--muted);font-size:11px}.warning{border-left:3px solid var(--accent);background:#fff6f2;padding:10px 12px;color:#71402f;font-size:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.error{min-height:18px;margin:0;color:var(--danger);font-size:12px}.toast{position:fixed;right:18px;bottom:18px;z-index:30;max-width:min(360px,calc(100% - 36px));border-radius:8px;background:var(--ink);padding:11px 14px;color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}
    @media(max-width:820px){.topbar{padding:9px 12px}.brand small,.logout-text{display:none}.page{padding:20px 14px 40px}.intro{grid-template-columns:1fr;align-items:start}.stats{width:100%}.project-list{grid-template-columns:1fr}.project-actions .danger{margin-left:0}.intro h1{font-size:24px}}
    @media(max-width:480px){.top-actions{gap:4px}.btn{padding:0 9px}.new-text{display:none}.filters{align-items:stretch;flex-wrap:wrap}.search{flex-basis:100%}.stats{grid-template-columns:1fr 1fr 1fr}.stat{min-width:0;padding:9px}.meta-row{display:grid;gap:1px}.meta-row span:last-child{text-align:left}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <a class="skip" href="#projects">跳到项目列表</a>
  <header class="topbar">
    <div class="brand"><span class="mark">PN</span><span>PageNote Root<small>项目管理控制台</small></span></div>
    <div class="top-actions"><a class="btn primary" href="/pagenote/">＋ <span class="new-text">新建项目</span></a><form class="logout" action="/logout" method="post"><button class="btn" type="submit">退出<span class="logout-text">登录</span></button></form></div>
  </header>
  <main class="page">
    <section class="intro" aria-labelledby="pageTitle">
      <div><div class="eyebrow">PAGENOTE / ROOT</div><h1 id="pageTitle">全部共享项目</h1><p>管理项目名称和 HTML 内容，不改变现有分享地址。</p></div>
      <div class="stats" aria-label="项目统计"><div class="stat"><strong id="projectTotal">-</strong><span>项目</span></div><div class="stat"><strong id="noteTotal">-</strong><span>批注</span></div><div class="stat"><strong id="openTotal">-</strong><span>待处理</span></div></div>
    </section>
    <section class="filters" aria-label="项目筛选"><input id="searchInput" class="search" type="search" placeholder="搜索项目名称、文件名或分享 ID" aria-label="搜索项目"><span id="resultCount" class="result"></span><button id="refreshButton" class="btn" type="button">刷新</button></section>
    <section id="projects" class="project-list" aria-live="polite"><div class="loading">正在读取项目…</div></section>
  </main>

  <dialog id="editDialog" aria-labelledby="editTitle"><div class="dialog-head"><h2 id="editTitle">编辑项目名称</h2><button class="close" type="button" aria-label="关闭">×</button></div><form class="form" id="editForm"><div class="field"><label for="projectName">项目名称</label><input id="projectName" maxlength="100" required></div><p class="help">分享地址和已有批注不会改变。</p><p class="error" role="alert"></p><div class="dialog-actions"><button class="btn cancel" type="button">取消</button><button class="btn primary" type="submit">保存</button></div></form></dialog>
  <dialog id="replaceDialog" aria-labelledby="replaceTitle"><div class="dialog-head"><h2 id="replaceTitle">替换 HTML</h2><button class="close" type="button" aria-label="关闭">×</button></div><form class="form" id="replaceForm"><div class="field"><label for="replaceFile">新的 HTML 文件</label><input id="replaceFile" type="file" accept=".html,.htm,text/html" required></div><p class="warning">分享地址和批注记录会保留，但页面结构变化可能使旧批注无法定位到原元素。</p><p class="error" role="alert"></p><div class="dialog-actions"><button class="btn cancel" type="button">取消</button><button class="btn primary" type="submit">替换文件</button></div></form></dialog>
  <dialog id="deleteDialog" aria-labelledby="deleteTitle"><div class="dialog-head"><h2 id="deleteTitle">删除项目</h2><button class="close" type="button" aria-label="关闭">×</button></div><form class="form" id="deleteForm"><p class="warning">删除后分享链接立即失效，项目下的全部批注与回复也会永久删除。</p><div class="field"><label for="deleteConfirm">输入项目名称以确认</label><input id="deleteConfirm" autocomplete="off" required></div><p class="error" role="alert"></p><div class="dialog-actions"><button class="btn cancel" type="button">取消</button><button class="btn danger" type="submit">永久删除</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (()=>{
      const list=document.querySelector('#projects');const search=document.querySelector('#searchInput');const toast=document.querySelector('#toast');let projects=[];let active=null;let toastTimer;
      const fmt=value=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(value));
      const bytes=value=>value<1024?`${value} B`:value<1048576?`${(value/1024).toFixed(1)} KB`:`${(value/1048576).toFixed(1)} MB`;
      const notify=message=>{toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)};
      const api=async(url,options={})=>{const response=await fetch(url,options);if(response.status===401){location.href='/pagenote/root';throw new Error('登录已过期')}const data=await response.json().catch(()=>({error:'服务器响应无效。'}));if(!response.ok)throw new Error(data.error||`请求失败 (${response.status})`);return data};
      const headers=json=>({'X-PageNote-Admin':'1',...(json?{'Content-Type':'application/json'}:{})});
      const copy=async text=>{try{await navigator.clipboard.writeText(text)}catch{const field=document.createElement('textarea');field.value=text;document.body.appendChild(field);field.select();document.execCommand('copy');field.remove()}notify('分享链接已复制')};
      const render=()=>{
        const query=search.value.trim().toLowerCase();const visible=projects.filter(p=>`${p.title} ${p.filename} ${p.id}`.toLowerCase().includes(query));list.innerHTML='';document.querySelector('#projectTotal').textContent=projects.length;document.querySelector('#noteTotal').textContent=projects.reduce((n,p)=>n+p.noteCount,0);document.querySelector('#openTotal').textContent=projects.reduce((n,p)=>n+p.openCount,0);document.querySelector('#resultCount').textContent=`显示 ${visible.length} / ${projects.length}`;
        if(!visible.length){list.innerHTML=`<div class="empty"><strong>${projects.length?'没有匹配的项目':'还没有项目'}</strong>${projects.length?'换一个关键词试试。':'从右上角新建第一个共享项目。'}</div>`;return}
        visible.forEach((project,index)=>{const article=document.createElement('article');article.className='project';article.innerHTML=`<div class="project-head"><span class="project-index"></span><div class="project-name"><h2></h2><div class="project-id"></div></div></div><div class="project-metrics"><div class="metric"><strong>${project.noteCount}</strong><span>批注</span></div><div class="metric"><strong>${project.openCount}</strong><span>待处理</span></div><div class="metric"><strong>${project.replyCount}</strong><span>回复</span></div></div><div class="meta"><div class="meta-row"><span>HTML 文件</span><span class="filename"></span></div><div class="meta-row"><span>创建者</span><span class="creator"></span></div><div class="meta-row"><span>最近更新</span><span class="updated"></span></div></div><div class="project-actions"><a class="btn open" target="_blank" rel="noopener">打开</a><button class="btn copy" type="button">复制链接</button><button class="btn edit" type="button">改名</button><button class="btn replace" type="button">替换 HTML</button><button class="btn danger remove" type="button">删除</button></div>`;
          article.querySelector('.project-index').textContent=String(index+1).padStart(2,'0');article.querySelector('h2').textContent=project.title;article.querySelector('.project-id').textContent=project.id;article.querySelector('.filename').textContent=`${project.filename} · ${bytes(project.htmlBytes)}`;article.querySelector('.creator').textContent=project.createdBy;article.querySelector('.updated').textContent=fmt(project.updatedAt);article.querySelector('.open').href=project.shareUrl;article.querySelector('.copy').addEventListener('click',()=>copy(location.origin+project.shareUrl));article.querySelector('.edit').addEventListener('click',()=>openDialog('edit',project));article.querySelector('.replace').addEventListener('click',()=>openDialog('replace',project));article.querySelector('.remove').addEventListener('click',()=>openDialog('delete',project));list.appendChild(article)});
      };
      const load=async()=>{list.innerHTML='<div class="loading">正在读取项目…</div>';try{projects=(await api('/api/pagenote/admin/projects')).projects;render()}catch(error){list.innerHTML=`<div class="empty"><strong>无法读取项目</strong>${error.message}</div>`}};
      const dialogs={edit:document.querySelector('#editDialog'),replace:document.querySelector('#replaceDialog'),delete:document.querySelector('#deleteDialog')};
      const openDialog=(kind,project)=>{active=project;const dialog=dialogs[kind];dialog.querySelector('.error').textContent='';if(kind==='edit')document.querySelector('#projectName').value=project.title;if(kind==='replace')document.querySelector('#replaceFile').value='';if(kind==='delete'){document.querySelector('#deleteConfirm').value='';document.querySelector('#deleteConfirm').placeholder=project.title}dialog.showModal();setTimeout(()=>dialog.querySelector('input').focus(),0)};
      Object.values(dialogs).forEach(dialog=>{dialog.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.querySelector('.cancel').addEventListener('click',()=>dialog.close())});
      document.querySelector('#editForm').addEventListener('submit',async event=>{event.preventDefault();const title=document.querySelector('#projectName').value.trim();try{projects=(await api(`/api/pagenote/admin/projects/${active.id}`,{method:'PATCH',headers:headers(true),body:JSON.stringify({title})})).projects;dialogs.edit.close();render();notify('项目名称已更新')}catch(error){dialogs.edit.querySelector('.error').textContent=error.message}});
      document.querySelector('#replaceForm').addEventListener('submit',async event=>{event.preventDefault();const file=document.querySelector('#replaceFile').files?.[0];if(!file)return;const form=new FormData();form.append('file',file);try{projects=(await api(`/api/pagenote/admin/projects/${active.id}/content`,{method:'POST',headers:headers(false),body:form})).projects;dialogs.replace.close();render();notify('HTML 已替换，分享链接保持不变')}catch(error){dialogs.replace.querySelector('.error').textContent=error.message}});
      document.querySelector('#deleteForm').addEventListener('submit',async event=>{event.preventDefault();const value=document.querySelector('#deleteConfirm').value;if(value!==active.title){dialogs.delete.querySelector('.error').textContent='输入的项目名称不一致。';return}try{await api(`/api/pagenote/admin/projects/${active.id}`,{method:'DELETE',headers:headers(false)});projects=projects.filter(project=>project.id!==active.id);dialogs.delete.close();render();notify('项目已删除')}catch(error){dialogs.delete.querySelector('.error').textContent=error.message}});
      search.addEventListener('input',render);document.querySelector('#refreshButton').addEventListener('click',()=>{load();notify('项目列表已刷新')});load();
    })();
  </script>
</body>
</html>
